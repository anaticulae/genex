[build-system]
requires = [
    "setuptools>=83.0.0",
    "wheel>=0.47.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "gennex"
version = "1.1.0"
description = ""
requires-python = ">=3.12"
authors = [
    { name = "Helmut Konrad Schewe", email = "helmutus@outlook.com" },
]
dependencies = [
    "utilo>=2.109.1,<3.0.0",
    "iamraw>=4.92.0,<5.0.0",
    "protoerror>=3.20.2,<4.0.0",
    "resinf>=1.0.4,<2.0.0",
    "pdflog>=1.0.2,<2.0.0",
]
keywords = []
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
license = "MIT"
license-files = [
    "LICENSE",
]

[project.readme]
file = "README"
content-type = "text/markdown"

[project.optional-dependencies]
dev = [
    "utilotest>=1.0.4,<2.0.0",
    "hoverpower>=1.5.2,<2.0.0",
    "mundare>=1.0.2,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/anaticulae/gennex"
Repository = "https://github.com/anaticulae/gennex"

[project.scripts]
gennex_regen = "gennex.cli.regen:main"

[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version",
]

[tool.semantic_release.changelog]
mode = "init"
output_format = "md"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG"

[tool.semantic_release.commit_parser_options]
patch_tags = [
    "build",
    "chore",
    "ci",
    "deps",
    "docs",
    "fix",
    "perf",
    "refactor",
    "style",
    "test",
]
minor_tags = [
    "feat",
]

[tool.setuptools.packages.find]
where = [
    ".",
]
include = [
    "gennex",
    "gennex.cli",
]
exclude = [
    "tests*",
]

[tool.hoverpower]
packages = [
    "BACHELOR",
    "DOCU",
    "HOME",
]
